# Dashboard look (light theme; chart colours are set in services/dashboard/charts.py)
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
