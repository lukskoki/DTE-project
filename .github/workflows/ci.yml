name: CI

on:
  push:
    branches: [main, luka-version]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Cache the raw dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sdhar-home-raw-v1

      - name: Download and clean the dataset
        run: |
          ./scripts/download_data.sh
          python -m pipeline.build_dataset

      - name: Unit, parity and end-to-end tests
        run: python -m pytest -q

      - name: Start the whole system with Docker Compose
        env:
          REPLAY_SPEED: "600"
          REPLAY_DAYS: "53-54"
        run: docker compose up -d --build

      - name: Smoke test the running system
        run: python scripts/smoke_test.py --timeout 240

      - name: Logs
        if: always()
        run: docker compose logs --tail 60

      - name: Stop
        if: always()
        run: docker compose down
